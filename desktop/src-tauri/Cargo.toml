[package]
name = "tacfc-desktop"
version = "1.0.0"
description = "TAC FC desktop app (direct download): a small window on https://tacfc.com"
authors = ["TAC FC"]
edition = "2021"
publish = false

[lib]
name = "tacfc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
